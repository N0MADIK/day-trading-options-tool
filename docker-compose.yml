version: '3.8'

services:
  backend:
    build: ./backend
    container_name: options-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # SnapTrade Configuration
      - SNAPTRADE_CLIENT_ID=${SNAPTRADE_CLIENT_ID}
      - SNAPTRADE_CONSUMER_KEY=${SNAPTRADE_CONSUMER_KEY}
      # Plaid Configuration (if needed)
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      # Alpaca Configuration (if needed)
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
    env_file:
      - path: ./backend/.env
        required: false

  # Original day-trading frontend
  frontend:
    build: ./frontend
    container_name: options-frontend
    restart: always
    ports:
      - "5420:80"
    depends_on:
      - backend
    profiles: [ "v1" ]

  # Finance Flow Frontend v2 (integrated dashboard)
  frontend_v2:
    build:
      context: ./frontend_v2
      args:
        # API calls go through nginx proxy to backend container
        VITE_API_URL: ""
        VITE_WS_URL: ""
    container_name: finance-flow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    profiles: [ "v2" ]

networks:
  default:
    name: options-network
